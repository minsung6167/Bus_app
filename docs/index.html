<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시외버스 통합 예약 앱</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', 'Segoe UI', sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #1e293b;
    }
    .hero {
      text-align: center;
      padding: 60px 32px 40px;
    }
    .icon { font-size: 4rem; margin-bottom: 16px; }
    h1 { font-size: 2rem; font-weight: 800; color: #1e3a8a; }
    .sub { font-size: 1rem; color: #64748b; margin-top: 8px; }
    .cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 32px 60px;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 32px 36px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s, box-shadow 0.15s;
      min-width: 220px;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 32px rgba(37,99,235,0.15);
    }
    .card-icon { font-size: 2.4rem; margin-bottom: 12px; }
    .card h2 { font-size: 1.05rem; font-weight: 700; color: #1e3a8a; }
    .card p  { font-size: 0.85rem; color: #64748b; margin-top: 6px; }
    .badge {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      border-radius: 999px;
      padding: 3px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      margin-top: 14px;
    }
    footer { color: #94a3b8; font-size: 0.8rem; padding-bottom: 32px; }
  </style>
</head>
<body>
  <div class="hero">
    <div class="icon">🚌</div>
    <h1>시외버스 통합 예약 앱</h1>
    <p class="sub">최민성 · 신구대학교 · 2026 중간 발표</p>
  </div>

  <div class="cards">
    <a class="card" href="presentation/">
      <div class="card-icon">📊</div>
      <h2>발표 자료</h2>
      <p>중간 발표 슬라이드<br>브라우저에서 바로 재생</p>
      <span class="badge">Marp 프레젠테이션</span>
    </a>
    <a class="card" href="wbs/">
      <div class="card-icon">📋</div>
      <h2>WBS</h2>
      <p>작업 분류 구조 & 전체 일정<br>Gantt · MindMap</p>
      <span class="badge">GitHub Pages</span>
    </a>
    <div class="card" style="min-width:280px; max-width:340px;">
      <div class="card-icon">🎬</div>
      <h2>데모 영상</h2>
      <p style="margin-bottom:12px;">앱 실제 동작 화면</p>
      <video
        src="demo.mp4"
        controls
        style="width:100%; border-radius:10px; display:block;"
        preload="metadata"
      ></video>
    </div>
  </div>

  <footer>github.com/minsung6167/Bus_app</footer>
</body>
</html>
